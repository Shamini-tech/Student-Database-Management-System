<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EduPulse - Login & Register</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .auth-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; text-align: center; }
    .auth-card h2 { color: #0f4c81; margin-bottom: 20px; }
    input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #0f4c81; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #0b3860; }
    .toggle-link { margin-top: 15px; display: block; color: #0f4c81; cursor: pointer; font-size: 14px; }
    .divider { margin: 20px 0; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>

  <div class="auth-card">
    <h2 id="form-title">EduPulse Login</h2>
    
    <form id="auth-form">
      <input type="text" id="name" placeholder="Full Name" style="display: none;" />
      <input type="email" id="email" placeholder="Email Address" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit" id="submit-btn">Login</button>
    </form>

    <div class="toggle-link" onclick="toggleForm()">Need an account? Create one</div>

    <div class="divider"></div>

    <div id="g_id_onload"
         data-client_id="YOUR_GOOGLE_CLIENT_ID"
         data-callback="handleGoogleResponse">
    </div>
    <div class="g_id_signin" data-type="standard"></div>
  </div>

  <script>
    let isRegister = false;

    function toggleForm() {
      isRegister = !isRegister;
      document.getElementById('form-title').innerText = isRegister ? 'EduPulse - Create Account' : 'EduPulse Login';
      document.getElementById('name').style.display = isRegister ? 'block' : 'none';
      document.getElementById('name').required = isRegister;
      document.getElementById('submit-btn').innerText = isRegister ? 'Register' : 'Login';
      document.querySelector('.toggle-link').innerText = isRegister ? 'Already have an account? Login' : 'Need an account? Create one';
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const endpoint = isRegister ? '/api/auth/register' : '/api/auth/login';
      const body = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        ...(isRegister && { name: document.getElementById('name').value })
      };

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('token', data.token);
        window.location.href = '/index.html';
      } else {
        alert(data.message || data.error);
      }
    });

    async function handleGoogleResponse(response) {
      const res = await fetch('/api/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken: response.credential })
      });

      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('token', data.token);
        window.location.href = '/index.html';
      } else {
        alert('Google Login Failed');
      }
    }
  </script>
</body>
</html>
